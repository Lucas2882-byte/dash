name: Clean Repository

on:
  workflow_dispatch:   # permet de lancer l'action manuellement

jobs:
  clean:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Clean all files except README.md and .github
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name "README.md" ! -name ".github" -exec rm -rf {} \;
          echo "🧹 Repo cleaned"

      - name: Commit changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add -A
          git commit -m "Clean repo – removed all files except README and .github" || echo "Nothing to commit"

      - name: Push changes
        run: |
          git push
